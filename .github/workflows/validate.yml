name: Validate QGIS plugin source
on:
  push:
  pull_request:
jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate static package
        run: python scripts/validate_plugin.py Directional_line_buffer_Tool
      - name: Run dependency-free tests (real QGIS tests skip here)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and verify ZIP
        run: |
          python scripts/package_plugin.py --output dist/DirectionalLineBuffer.zip
          python scripts/validate_plugin.py Directional_line_buffer_Tool --zip dist/DirectionalLineBuffer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: qgis-plugin-${{ matrix.python-version }}
          path: dist/DirectionalLineBuffer.zip
